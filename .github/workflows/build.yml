name: Build Tracker for Windows & Linux

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # --- LINUX SPECIFIC SETUP ---
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk python3-dev xdotool

    # --- WINDOWS & LINUX DEPENDENCIES ---
    - name: Install Python Libraries
      run: |
        pip install -r requirements.txt

    # --- BUILD COMMAND ---
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name=hrm_tracker_${{ runner.os }} tracker.py

    # --- UPLOAD ARTIFACTS ---
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: tracker-builds
        path: dist/
