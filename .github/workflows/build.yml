name: Build All Packages (Exe, Deb, Rpm)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ------------------------------------
  # JOB 1: WINDOWS BUILD
  # ------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Exe
      run: |
        # --noconsole prevents the black window from popping up
        pyinstaller --onefile --noconsole --name=hrm_tracker_win tracker.py

    - name: Upload Windows Exe
      uses: actions/upload-artifact@v4
      with:
        name: hrm-tracker-windows
        path: dist/hrm_tracker_win.exe

  # ------------------------------------
  # JOB 2: LINUX BUILD (DEB & RPM)
  # ------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 1. Install Tools
    # ADDED 'scrot' here (Critical for taking screenshots on Linux)
    - name: Install System Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev rubygems build-essential xdotool python3-tk scrot
        sudo gem install --no-document fpm

    # 2. Build Binary
    - name: Build Binary with PyInstaller
      run: |
        pip install -r requirements.txt
        pip install pyinstaller
        pyinstaller --onefile --noconsole \
          --hidden-import="pynput.keyboard._xorg" \
          --hidden-import="pynput.mouse._xorg" \
          --name=hrm-tracker tracker.py

    # 3. Prepare Folders
    - name: Prepare Package Folders
      run: |
        # Create folder structure
        mkdir -p build_root/usr/bin
        mkdir -p build_root/usr/share/applications
        
        # Copy the binary we just built
        cp dist/hrm-tracker build_root/usr/bin/
        
        # --- APP SHORTCUT (Start Menu Entry) ---
        # Note: This is separate from the Auto-Start logic in the Python script.
        # This one puts the icon in the User's Application Menu.
        echo "[Desktop Entry]" > build_root/usr/share/applications/hrm-tracker.desktop
        echo "Type=Application" >> build_root/usr/share/applications/hrm-tracker.desktop
        echo "Name=HRM Tracker" >> build_root/usr/share/applications/hrm-tracker.desktop
        echo "Comment=Employee Activity Tracker" >> build_root/usr/share/applications/hrm-tracker.desktop
        echo "Exec=/usr/bin/hrm-tracker" >> build_root/usr/share/applications/hrm-tracker.desktop
        echo "Terminal=false" >> build_root/usr/share/applications/hrm-tracker.desktop
        echo "Categories=Utility;Office;" >> build_root/usr/share/applications/hrm-tracker.desktop

    # 4. Build .DEB (Ubuntu/Debian)
    # ADDED 'scrot' to dependencies so it installs automatically on user machine
    - name: Build .DEB Package
      run: |
        fpm -s dir -t deb \
          -n hrm-tracker \
          -v 1.0.0 \
          -C build_root \
          -d "xdotool" \
          -d "scrot" \
          --description "HRM Employee Tracker" \
          --maintainer "SoftexSolution <admin@softexsolution.com>" \
          .

    # 5. Build .RPM (Fedora/RedHat)
    - name: Build .RPM Package
      run: |
        fpm -s dir -t rpm \
          -n hrm-tracker \
          -v 1.0.0 \
          -C build_root \
          -d "xdotool" \
          -d "scrot" \
          --description "HRM Employee Tracker" \
          --maintainer "SoftexSolution <admin@softexsolution.com>" \
          .

    # 6. Upload Results
    - name: Upload Linux Packages
      uses: actions/upload-artifact@v4
      with:
        name: hrm-tracker-linux-packages
        path: |
          *.deb
          *.rpm
          dist/hrm-tracker
