name: Build Tracker for Windows & Linux

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4  # Updated to v4

    - name: Set up Python
      uses: actions/setup-python@v5 # Updated to v5
      with:
        python-version: '3.10'

    # --- LINUX SPECIFIC SETUP ---
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk python3-dev xdotool

    # --- WINDOWS & LINUX DEPENDENCIES ---
    - name: Install Python Libraries
      run: |
        pip install -r requirements.txt

    # --- BUILD COMMAND ---
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name=hrm_tracker_${{ runner.os }} tracker.py

    # --- UPLOAD ARTIFACTS (FIXED) ---
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4  # Updated to v4
      with:
        # We add runner.os to the name to create two separate zip files
        # (tracker-build-Linux.zip and tracker-build-Windows.zip)
        name: tracker-build-${{ runner.os }}
        path: dist/
